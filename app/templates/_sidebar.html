<!-- Unified Sidebar Component -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo-container">
      <div class="logo-icon">📁</div>
      <div class="logo-text">
        <div class="logo-title">Life Admin</div>
        <div class="logo-subtitle">Document Intelligence</div>
      </div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <!-- Main Navigation -->
    <div class="nav-section">
      <div class="nav-section-title">Navigation</div>
      <a href="/dashboard" class="nav-item {% if request.path == '/dashboard' %}active{% endif %}">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Dashboard</span>
      </a>
      <a href="/?source=all" class="nav-item {% if request.path == '/' %}active{% endif %}">
        <span class="nav-icon">🗄️</span>
        <span class="nav-label">Vault</span>
        {% if counts and counts.all %}
        <span class="nav-count">{{ counts.all }}</span>
        {% endif %}
      </a>
      <a href="/actions" class="nav-item {% if request.path == '/actions' %}active{% endif %}">
        <span class="nav-icon">⚡</span>
        <span class="nav-label">Actions</span>
        {% if action_count and action_count > 0 %}
        <span class="nav-count badge-warning">{{ action_count }}</span>
        {% endif %}
      </a>
    </div>

    <!-- Intelligence -->
    <div class="nav-section">
      <div class="nav-section-title">Intelligence</div>
      <a href="/categories" class="nav-item {% if request.path == '/categories' or request.path.startswith('/category/') %}active{% endif %}">
        <span class="nav-icon">🏷️</span>
        <span class="nav-label">Categories</span>
      </a>
      <a href="/agents" class="nav-item {% if request.path == '/agents' %}active{% endif %}">
        <span class="nav-icon">🤖</span>
        <span class="nav-label">Agents</span>
      </a>
      <a href="/entities-manage" class="nav-item {% if request.path == '/entities-manage' %}active{% endif %}">
        <span class="nav-icon">👥</span>
        <span class="nav-label">Entities</span>
      </a>
    </div>

    <!-- Tools -->
    <div class="nav-section">
      <div class="nav-section-title">Tools</div>
      <a href="/upload" class="nav-item">
        <span class="nav-icon">⬆️</span>
        <span class="nav-label">Upload</span>
      </a>
      <a href="/docs/" class="nav-item" target="_blank">
        <span class="nav-icon">📚</span>
        <span class="nav-label">Docs</span>
        <span class="nav-external">↗</span>
      </a>
    </div>
  </nav>

  <div class="sidebar-footer">
    <button class="btn btn-primary btn-upload" onclick="showUploadModal()" style="width: 100%;">
      <span>⬆️</span>
      <span>Quick Upload</span>
    </button>
  </div>
</aside>
